name: Build PIRATE TOKEN BOT exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install modules
        run: python -m pip install pyinstaller pyautogui keyboard pillow
      - name: Build exe
        run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: PIRATE-TOKEN-BOT-exe
          path: dist/*.exe
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PIRATE TOKEN BOT build ${{ github.run_number }}
          files: dist/*.exe
