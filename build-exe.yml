name: Build PIRATE TOKEN BOT exe

# Собирает готовый один EXE-файл на серверах GitHub (Windows). Ничего ставить на свой компьютер не нужно.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install modules
        run: python -m pip install pyinstaller pyautogui keyboard pillow
      - name: Build one-file exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "PIRATE TOKEN BOT" --icon "PIRATE_ICON.ico" --collect-all pyautogui --collect-all keyboard --hidden-import PIL._tkinter_finder --add-data "PIRATE_ICON.ico;." --add-data "PIRATE_ICON.png;." --add-data "PIRATE_ICON_BLACK.ico;." --add-data "PIRATE_ICON_BLACK.png;." --add-data "PIRATE_ICON_WHITE.ico;." --add-data "PIRATE_ICON_WHITE.png;." --add-data "Sound 1.wav;." --add-data "Sound 2.wav;." --add-data "Sound 3.wav;." --add-data "Sound 4.wav;." --add-data "Sound 5.wav;." --add-data "Sound 6.wav;." --add-data "Sound 7.wav;." --add-data "Sound 8.wav;." --add-data "Sound 9.wav;." --add-data "Sound Stop.wav;." PIRATE_TOKEN_BOT.py
      - uses: actions/upload-artifact@v4
        with:
          name: PIRATE-TOKEN-BOT-exe
          path: dist/PIRATE TOKEN BOT.exe
